version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: daily
      time: "12:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 10
    target-branch: main
    # NuGet updates only packages declared in Directory.Packages.props.
    # dependency-type: all does not include NuGet transitive packages, so those
    # versions are pinned there. default-days: 0 turns off the 3-day cooldown
    # that otherwise delays version-update pull requests.
    cooldown:
      default-days: 0
    labels:
      - dependencies
      - nuget
    groups:
      nuget-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "09:00"
      timezone: UTC
    cooldown:
      default-days: 0
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions-dependencies:
        patterns:
          - "actions/*"
