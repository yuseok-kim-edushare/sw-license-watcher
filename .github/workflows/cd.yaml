name: Continuous Deployment

on:
  workflow_run:
    workflows: ["CI tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (x.y.z). Leave empty to auto-compute from tags and commit messages."
        required: false
        type: string

permissions:
  contents: write

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref_name }}

      - name: Fetch tags
        shell: pwsh
        run: |
          if (Test-Path .git/shallow) {
            git fetch --unshallow --force --tags origin
          } else {
            git fetch --force --tags origin
          }
          git tag --list --sort=-version:refname | Select-Object -First 15

      - name: Get USERPROFILE and set CACHE_PATH
        shell: pwsh
        run: |
          $userProfile = [System.Environment]::GetEnvironmentVariable("USERPROFILE")
          $cachePath = Join-Path $userProfile ".nuget\packages"
          echo "CACHE_PATH=$cachePath" >> $env:GITHUB_ENV

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
            ${{ env.CACHE_PATH }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Restore dependencies
        run: dotnet restore SwLicenseWatcher.slnx

      - name: Compute next release version
        shell: pwsh
        env:
          MANUAL_VERSION: ${{ github.event.inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Variable -Name PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
            $PSNativeCommandUseErrorActionPreference = $false
          }

          function Test-ReleaseVersion([string]$value) {
            return $value -match '^\d+\.\d+\.\d+$'
          }

          function Get-VersionOverride([string[]]$messages) {
            $pattern = '(?i)update\s+version\s+to\s+v?(\d+\.\d+\.\d+)'
            foreach ($line in @($messages)) {
              if ($line -match $pattern) {
                return $Matches[1]
              }
            }
            return $null
          }

          $headSubject = (git log -1 --format=%s).Trim()
          Write-Output "HEAD $(git rev-parse --short HEAD): $headSubject"

          $latestRelease = @(git tag --list --sort=-version:refname | Where-Object { Test-ReleaseVersion $_ } | Select-Object -First 1)
          $latestRelease = "$latestRelease".Trim()
          if ($latestRelease) {
            Write-Output "Latest release version: $latestRelease"
            echo "latest_release=$latestRelease" >> $env:GITHUB_ENV
          } else {
            Write-Output "No previous x.y.z release tag found."
          }

          $manualVersion = "$env:MANUAL_VERSION".Trim()
          if ($manualVersion) {
            if (-not (Test-ReleaseVersion $manualVersion)) {
              throw "workflow_dispatch version '$manualVersion' must be x.y.z"
            }
            $newVersionString = $manualVersion
            Write-Output "Using workflow_dispatch version: $newVersionString"
          } elseif ($latestRelease) {
            $version = [Version]$latestRelease
            $newVersionString = '{0}.{1}.{2}' -f $version.Major, $version.Minor, ($version.Build + 1)
            Write-Output "Default next version (patch + 1): $newVersionString"

            $messages = @(git log -1 --format=%B)
            git rev-parse --verify --quiet "${latestRelease}^{commit}" | Out-Null
            if ($LASTEXITCODE -eq 0) {
              $rangeMessages = @(git log --format=%B "$latestRelease..HEAD")
              if ($rangeMessages.Count -gt 0) {
                $messages = $rangeMessages
                Write-Output "Scanning commit messages in $latestRelease..HEAD"
              } else {
                Write-Output "No commits in $latestRelease..HEAD; scanning HEAD only"
              }
            } else {
              Write-Output "Tag $latestRelease is not a resolvable commit; scanning last 50 commits on HEAD"
              $messages = @(git log --format=%B -n 50)
            }

            $override = Get-VersionOverride $messages
            if ($override) {
              Write-Output "Commit message requested version: $override"
              $newVersionString = $override
            } else {
              Write-Output "No 'Update Version To x.y.z' commit message found; keeping $newVersionString"
            }
          } else {
            $override = Get-VersionOverride @(git log --format=%B -n 50)
            if ($override) {
              $newVersionString = $override
              Write-Output "Commit message requested initial version: $newVersionString"
            } else {
              $newVersionString = '0.0.1'
              Write-Output "Creating initial release 0.0.1"
            }
          }

          if (-not (Test-ReleaseVersion $newVersionString)) {
            throw "Computed version '$newVersionString' is not x.y.z"
          }

          if ($latestRelease -and [Version]$newVersionString -le [Version]$latestRelease) {
            throw "Release version $newVersionString must be greater than latest release $latestRelease"
          }

          $existingTag = @(git tag --list $newVersionString)
          if ($existingTag.Count -gt 0) {
            throw "Tag $newVersionString already exists"
          }

          Write-Output "Next release version: $newVersionString"
          echo "new_release=$newVersionString" >> $env:GITHUB_ENV

      - name: Publish Agent Watchdog (win-x64, Native AOT)
        shell: pwsh
        run: dotnet publish src/SwLicenseWatcher.Agent.Watchdog/SwLicenseWatcher.Agent.Watchdog.csproj -r win-x64 -c Release -p:Version=$env:new_release -p:AssemblyVersion=$($env:new_release).0 -p:FileVersion=$($env:new_release).0 -p:InformationalVersion=$env:new_release -o ./publish/agent-watchdog/win-x64

      - name: Publish Agent Worker (win-x64, Native AOT)
        shell: pwsh
        run: dotnet publish src/SwLicenseWatcher.Agent.Worker/SwLicenseWatcher.Agent.Worker.csproj -r win-x64 -c Release -p:Version=$env:new_release -p:AssemblyVersion=$($env:new_release).0 -p:FileVersion=$($env:new_release).0 -p:InformationalVersion=$env:new_release -o ./publish/agent-worker/win-x64

      - name: Publish Api (win-x64, Native AOT)
        shell: pwsh
        run: dotnet publish src/SwLicenseWatcher.Api/SwLicenseWatcher.Api.csproj -r win-x64 -c Release -p:Version=$env:new_release -p:AssemblyVersion=$($env:new_release).0 -p:FileVersion=$($env:new_release).0 -p:InformationalVersion=$env:new_release -o ./publish/api/win-x64

      - name: Publish Api (win-x64, IIS in-process)
        shell: pwsh
        run: dotnet publish src/SwLicenseWatcher.Api/SwLicenseWatcher.Api.csproj -r win-x64 -c Release --self-contained false -p:PublishAot=false -p:PublishTrimmed=false -p:UseAppHost=false -p:Version=$env:new_release -p:AssemblyVersion=$($env:new_release).0 -p:FileVersion=$($env:new_release).0 -p:InformationalVersion=$env:new_release -o ./publish/api/iis/win-x64

      - name: Publish Setup Launcher (win-x64, Native AOT)
        shell: pwsh
        run: dotnet publish src/SwLicenseWatcher.Setup.Launcher/SwLicenseWatcher.Setup.Launcher.csproj -r win-x64 -c Release -p:Version=$env:new_release -p:AssemblyVersion=$($env:new_release).0 -p:FileVersion=$($env:new_release).0 -p:InformationalVersion=$env:new_release -o ./publish/setup-launcher/win-x64

      - name: Publish Setup UI (win-x64, self-contained)
        shell: pwsh
        run: dotnet publish src/SwLicenseWatcher.Setup/SwLicenseWatcher.Setup.csproj -r win-x64 -c Release --self-contained true -p:PublishSingleFile=true -p:PublishAot=false -p:PublishTrimmed=false -p:Version=$env:new_release -p:AssemblyVersion=$($env:new_release).0 -p:FileVersion=$($env:new_release).0 -p:InformationalVersion=$env:new_release -o ./publish/setup-ui/win-x64

      - name: Publish Packager (win-x64, self-contained)
        shell: pwsh
        run: dotnet publish src/SwLicenseWatcher.Packager/SwLicenseWatcher.Packager.csproj -r win-x64 -c Release --self-contained true -p:PublishSingleFile=true -p:PublishAot=false -p:PublishTrimmed=false -p:Version=$env:new_release -p:AssemblyVersion=$($env:new_release).0 -p:FileVersion=$($env:new_release).0 -p:InformationalVersion=$env:new_release -o ./publish/packager/win-x64

      - name: Stamp agent version files
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:new_release)) {
            throw "new_release is not set."
          }

          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          foreach ($relative in @("publish\agent-worker\win-x64", "publish\agent-watchdog\win-x64")) {
            $dir = Join-Path "${{ github.workspace }}" $relative
            if (!(Test-Path $dir)) {
              Write-Error "Publish output not found at: $dir"
              exit 1
            }
            $path = Join-Path $dir ".version"
            [System.IO.File]::WriteAllText($path, $env:new_release, $utf8NoBom)
            Write-Host "Wrote $path"
          }

      - name: Detect signing certificate
        shell: pwsh
        run: |
          if ("${{ secrets.SIGNING_CERTIFICATE_PFX_BASE64 }}" -ne "") {
            echo "HAS_SIGNING_CERT=true" >> $env:GITHUB_ENV
          } else {
            echo "HAS_SIGNING_CERT=false" >> $env:GITHUB_ENV
            Write-Host "No SIGNING_CERTIFICATE_PFX_BASE64 secret. Published binaries are unsigned. Set the Worker update pin RequireAuthenticode to false, or sign the Worker ZIP contents with a company certificate and re-hash."
          }

      - name: Sign published binaries
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_PFX_BASE64: ${{ secrets.SIGNING_CERTIFICATE_PFX_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          SIGNING_TIMESTAMP_URL: ${{ secrets.SIGNING_TIMESTAMP_URL }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_PFX_BASE64))

          $kitsRoot = [Environment]::GetEnvironmentVariable("ProgramFiles(x86)")
          $signtool = Get-ChildItem -Path (Join-Path $kitsRoot "Windows Kits\10\bin\*\x64\signtool.exe") -ErrorAction SilentlyContinue |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if ($null -eq $signtool) {
            throw "signtool.exe was not found under the Windows SDK (Windows Kits\10\bin\*\x64)."
          }

          $timestampUrl = $env:SIGNING_TIMESTAMP_URL
          if ([string]::IsNullOrWhiteSpace($timestampUrl)) {
            $timestampUrl = "http://timestamp.digicert.com"
          }

          $publishRoot = Join-Path "${{ github.workspace }}" "publish"
          $binaries = Get-ChildItem -Path $publishRoot -Recurse -File | Where-Object { $_.Extension -in ".exe", ".dll" }
          if ($binaries.Count -eq 0) {
            throw "No EXE/DLL files found under publish/ to sign."
          }

          Write-Host "Signing $($binaries.Count) binaries with $($signtool.FullName)"
          foreach ($file in $binaries) {
            & $signtool.FullName sign /f $pfxPath /p $env:SIGNING_CERTIFICATE_PASSWORD /fd SHA256 /tr $timestampUrl /td SHA256 $file.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "signtool failed for $($file.FullName) with exit code $LASTEXITCODE."
            }
          }

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "signing.pfx"
          if (Test-Path $pfxPath) {
            Remove-Item -Path $pfxPath -Force
          }

      - name: Prepare release files
        shell: pwsh
        run: |
          $projectRoot = "${{ github.workspace }}"
          $releaseRoot = Join-Path $projectRoot "release-files"

          if (Test-Path $releaseRoot) {
            Remove-Item -Path $releaseRoot -Recurse -Force
          }
          New-Item -Path $releaseRoot -ItemType Directory -Force | Out-Null

          $stagingName = "SwLicenseWatcher-staging"
          $stagingDir = Join-Path $releaseRoot $stagingName
          New-Item -Path $stagingDir -ItemType Directory -Force | Out-Null

          foreach ($copy in @(
            @{ Src = "publish\agent-watchdog\win-x64"; Dest = "agent-watchdog\win-x64" },
            @{ Src = "publish\agent-worker\win-x64"; Dest = "agent-worker\win-x64" },
            @{ Src = "publish\api\win-x64"; Dest = "api\win-x64" },
            @{ Src = "publish\api\iis\win-x64"; Dest = "api\iis\win-x64" }
          )) {
            $src = Join-Path $projectRoot $copy.Src
            $dest = Join-Path $stagingDir $copy.Dest
            if (!(Test-Path $src)) {
              Write-Error "Publish output not found at: $src"
              exit 1
            }
            New-Item -Path $dest -ItemType Directory -Force | Out-Null
            Copy-Item -Path "$src\*" -Destination $dest -Recurse -Force
          }

          foreach ($fileCopy in @(
            @{ Src = "publish\packager\win-x64\SwLicenseWatcher.Packager.exe"; Dest = "Packager.exe" },
            @{ Src = "publish\setup-launcher\win-x64\SwLicenseWatcher-Setup.exe"; Dest = "SwLicenseWatcher-Setup.exe" },
            @{ Src = "publish\setup-ui\win-x64\SwLicenseWatcher.Setup.exe"; Dest = "setup-ui\SwLicenseWatcher.Setup.exe" }
          )) {
            $src = Join-Path $projectRoot $fileCopy.Src
            $dest = Join-Path $stagingDir $fileCopy.Dest
            if (!(Test-Path $src)) {
              Write-Error "Publish output not found at: $src"
              exit 1
            }
            New-Item -Path (Split-Path $dest -Parent) -ItemType Directory -Force | Out-Null
            Copy-Item -Path $src -Destination $dest -Force
          }

          Write-Host "Release staging contents:"
          Get-ChildItem -Path $stagingDir -Recurse -File | ForEach-Object {
            Write-Host $_.FullName.Replace($stagingDir, "")
          }

          echo "STAGING_DIR=$stagingDir" >> $env:GITHUB_ENV
          echo "RELEASE_ROOT=$releaseRoot" >> $env:GITHUB_ENV

      - name: Generate release notes and packages
        shell: pwsh
        run: |
          $newVersionString = $env:new_release
          if ([string]::IsNullOrWhiteSpace($newVersionString)) {
            throw "new_release is not set."
          }

          $latestRelease = $env:latest_release
          if ($latestRelease) {
            $releaseNotes = "## Changes since $latestRelease`n"
            $releaseNotes += (git log "$latestRelease..HEAD" --oneline) -join "`n"
            $releaseNotes += "`n`n### Files changed`n`n"
            $releaseNotes += (git diff "$latestRelease..HEAD" --compact-summary) -join "`n"
          } else {
            $releaseNotes = "## Initial Release v0.0.1`n"
            $releaseNotes += (git log --oneline -20) -join "`n"
            $releaseNotes += "`n`n### Package contents`n`n"
            $releaseNotes += "- agent-watchdog/win-x64/ - self-update Windows Service`n"
            $releaseNotes += "- agent-worker/win-x64/ - inventory collection Windows Service`n"
            $releaseNotes += "- api/win-x64/ - ASP.NET Core API Native AOT (Kestrel)`n"
            $releaseNotes += "- api/iis/win-x64/ - ASP.NET Core API for IIS in-process hosting`n"
            $releaseNotes += "- Packager.exe - IT GUI to bake server URL and agent token into one Setup.exe`n"
            $releaseNotes += "- SwLicenseWatcher-Setup.exe - empty launcher stub (do not give to employees)`n"
            $releaseNotes += "- setup-ui/SwLicenseWatcher.Setup.exe - employee install/uninstall UI`n"
            $releaseNotes += "- SwLicenseWatcher.Packager-{version}.zip - slimmer IT-only copy (no API)`n"
          }

          $zipName = "SwLicenseWatcher-$newVersionString.zip"
          $zipPath = Join-Path $env:RELEASE_ROOT $zipName
          $stagingParent = Split-Path $env:STAGING_DIR -Parent
          $renamedStaging = Join-Path $stagingParent "SwLicenseWatcher-$newVersionString"
          Rename-Item -Path $env:STAGING_DIR -NewName (Split-Path $renamedStaging -Leaf)

          if (Test-Path $zipPath) {
            Remove-Item -Path $zipPath -Force
          }
          Compress-Archive -Path $renamedStaging -DestinationPath $zipPath -Force

          $workerPublish = Join-Path "${{ github.workspace }}" "publish\agent-worker\win-x64"
          if (!(Test-Path $workerPublish)) {
            Write-Error "Worker publish output not found at: $workerPublish"
            exit 1
          }
          $workerZipName = "SwLicenseWatcher.Agent.Worker-$newVersionString.zip"
          $workerZipPath = Join-Path $env:RELEASE_ROOT $workerZipName
          if (Test-Path $workerZipPath) {
            Remove-Item -Path $workerZipPath -Force
          }
          Compress-Archive -Path (Join-Path $workerPublish "*") -DestinationPath $workerZipPath -Force

          $packagerStaging = Join-Path $env:RELEASE_ROOT "packager-staging"
          if (Test-Path $packagerStaging) {
            Remove-Item -Path $packagerStaging -Recurse -Force
          }
          New-Item -Path $packagerStaging -ItemType Directory -Force | Out-Null
          foreach ($relative in @(
            "Packager.exe",
            "SwLicenseWatcher-Setup.exe",
            "setup-ui",
            "agent-worker",
            "agent-watchdog"
          )) {
            $src = Join-Path $renamedStaging $relative
            if (!(Test-Path $src)) {
              Write-Error "Combined release is missing packager input: $src"
              exit 1
            }
            $dest = Join-Path $packagerStaging $relative
            if (Test-Path $src -PathType Container) {
              Copy-Item -Path $src -Destination $dest -Recurse -Force
            } else {
              Copy-Item -Path $src -Destination $dest -Force
            }
          }

          $packagerZipName = "SwLicenseWatcher.Packager-$newVersionString.zip"
          $packagerZipPath = Join-Path $env:RELEASE_ROOT $packagerZipName
          if (Test-Path $packagerZipPath) {
            Remove-Item -Path $packagerZipPath -Force
          }
          Compress-Archive -Path (Join-Path $packagerStaging "*") -DestinationPath $packagerZipPath -Force

          $combinedSha = (Get-FileHash -Algorithm SHA256 -Path $zipPath).Hash.ToLowerInvariant()
          $workerSha = (Get-FileHash -Algorithm SHA256 -Path $workerZipPath).Hash.ToLowerInvariant()
          $packagerSha = (Get-FileHash -Algorithm SHA256 -Path $packagerZipPath).Hash.ToLowerInvariant()
          $sumsPath = Join-Path $env:RELEASE_ROOT "SHA256SUMS.txt"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $sums = "$combinedSha  $zipName`n$workerSha  $workerZipName`n$packagerSha  $packagerZipName`n"
          [System.IO.File]::WriteAllText($sumsPath, $sums, $utf8NoBom)

          $packageUrl = "https://github.com/${{ github.repository }}/releases/download/$newVersionString/$workerZipName"
          $releaseNotes += "`n`n### Worker self-update package`n`n"
          $releaseNotes += "- Asset: $workerZipName`n"
          $releaseNotes += "- SHA-256: $workerSha`n"
          $releaseNotes += "`nReady-to-paste Worker update pin (`/admin` 업데이트 or ``PUT /api/updates/worker/manifest``):`n`n"
          $releaseNotes += "``````json`n"
          $releaseNotes += "{`n"
          $releaseNotes += "  `"Version`": `"$newVersionString`",`n"
          $releaseNotes += "  `"PackageUrl`": `"$packageUrl`",`n"
          $releaseNotes += "  `"Sha256`": `"$workerSha`"`n"
          $releaseNotes += "}`n"
          $releaseNotes += "```````n"

          echo "zip_path=$zipPath" >> $env:GITHUB_ENV
          echo "zip_name=$zipName" >> $env:GITHUB_ENV
          echo "worker_zip_path=$workerZipPath" >> $env:GITHUB_ENV
          echo "packager_zip_path=$packagerZipPath" >> $env:GITHUB_ENV
          echo "sha256sums_path=$sumsPath" >> $env:GITHUB_ENV

          $releaseNotes | Out-File -FilePath (Join-Path $env:RELEASE_ROOT "releaseNotes.txt") -Encoding utf8
          $releaseNotesContent = Get-Content -Path (Join-Path $env:RELEASE_ROOT "releaseNotes.txt") -Raw
          echo "release_notes<<EOF" >> $env:GITHUB_ENV
          echo "$releaseNotesContent" >> $env:GITHUB_ENV
          echo "EOF" >> $env:GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.zip_path }}
            ${{ env.worker_zip_path }}
            ${{ env.packager_zip_path }}
            ${{ env.sha256sums_path }}
          tag_name: ${{ env.new_release }}
          name: Release ${{ env.new_release }}
          body: ${{ env.release_notes }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
