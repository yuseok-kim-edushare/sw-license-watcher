name: CI tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/prompts/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/prompts/**"
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Get USERPROFILE and set CACHE_PATH
        shell: pwsh
        run: |
          $userProfile = [System.Environment]::GetEnvironmentVariable("USERPROFILE")
          $cachePath = Join-Path $userProfile ".nuget\packages"
          echo "CACHE_PATH=$cachePath" >> $env:GITHUB_ENV

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ${{ env.CACHE_PATH }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SwLicenseWatcher.slnx

      - name: Build
        run: dotnet build SwLicenseWatcher.slnx -c Release --no-restore

      - name: Test
        shell: pwsh
        run: |
          $testProjects = Get-ChildItem -Path tests -Recurse -Filter "*.csproj" -ErrorAction SilentlyContinue
          if ($testProjects) {
            foreach ($proj in $testProjects) {
              dotnet test $proj.FullName -c Release --no-restore --logger "console;verbosity=normal"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } else {
            Write-Host "No test projects found. Skipping tests."
          }

  trigger-auto-merge:
    runs-on: ubuntu-latest
    needs: build-test
    if: |
      github.event_name == 'pull_request' &&
      needs.build-test.result == 'success' &&
      github.actor == 'dependabot[bot]'
    permissions:
      actions: write
      contents: write
    steps:
      - name: Trigger auto-merge workflow
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;

            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'auto-merge-pr',
              client_payload: {
                pr_number: prNumber,
                triggered_by: 'ci-workflow',
                triggered_at: new Date().toISOString()
              }
            });

            console.log(`Triggered auto-merge workflow for PR #${prNumber}`);
